name: Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analysis-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Syntax check
        run: |
          python -m py_compile analysis/timing_analysis.py
          python -m py_compile scripts/select_experiment.py

      - name: Run tests
        run: python -m pytest -q analysis/tests
